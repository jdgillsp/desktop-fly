[package]
name = "dfcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The core is deliberately OS-free: no windowing, no rendering, no platform
# APIs. Everything here is portable between Windows, macOS and Linux, and is
# the part of DesktopFly worth preserving exactly (PORT_PLAN.md §3).

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
